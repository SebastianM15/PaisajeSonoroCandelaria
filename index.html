<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paisajes Sonoros — La Candelaria, Bogotá</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #0e0c0a;
    --surface: #1a1714;
    --border: rgba(255,255,255,0.08);
    --text: #f0ebe3;
    --muted: #8a8278;
    --past: #c8a96e;
    --past-glow: rgba(200,169,110,0.3);
    --present: #6eb8c8;
    --present-glow: rgba(110,184,200,0.3);
    --accent: #e8d9c0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    background: var(--surface);
  }
  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--accent);
  }
  .header-left p {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 2px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .layer-toggle {
    display: flex;
    gap: 6px;
    background: rgba(0,0,0,0.3);
    padding: 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .layer-btn {
    padding: 6px 14px;
    border-radius: 5px;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    letter-spacing: 0.04em;
  }
  .layer-btn.past { color: var(--past); }
  .layer-btn.present { color: var(--present); }
  .layer-btn.active-past { background: var(--past-glow); color: var(--past); }
  .layer-btn.active-present { background: var(--present-glow); color: var(--present); }
  .main { flex: 1; display: flex; overflow: hidden; }
  #map { flex: 1; z-index: 1; background: #2a2520; }
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .sidebar-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }
  .sidebar-empty .icon {
    width: 48px; height: 48px;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    font-size: 1.4rem;
  }
  .sidebar-empty p { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .sidebar-detail { flex: 1; display: none; flex-direction: column; overflow: hidden; }
  .sidebar-detail.visible { display: flex; }
  .detail-header { padding: 1.2rem 1.4rem; border-bottom: 1px solid var(--border); position: relative; }
  .detail-era { font-size: 0.65rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; margin-bottom: 6px; }
  .detail-era.past { color: var(--past); }
  .detail-era.present { color: var(--present); }
  .detail-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 400; color: var(--accent); line-height: 1.3; }
  .detail-desc { margin-top: 6px; font-size: 0.78rem; color: var(--muted); line-height: 1.6; }
  .player-section { padding: 1.2rem 1.4rem; border-bottom: 1px solid var(--border); }
  .player-label { font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .player-box { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .player-box audio { width: 100%; height: 32px; outline: none; }
  .player-filename { font-size: 0.7rem; color: var(--muted); margin-top: 6px; font-style: italic; }
  .metadata-section { padding: 1.2rem 1.4rem; flex: 1; overflow-y: auto; }
  .meta-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .meta-key { font-size: 0.72rem; color: var(--muted); min-width: 80px; padding-top: 1px; }
  .meta-val { font-size: 0.78rem; color: var(--text); line-height: 1.5; }
  .close-btn {
    position: absolute; top: 10px; right: 10px;
    width: 26px; height: 26px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); border-radius: 50%; cursor: pointer;
    font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
  }
  .close-btn:hover { color: var(--text); }
  .legend { padding: 0.8rem 1.4rem; border-top: 1px solid var(--border); display: flex; gap: 1.2rem; flex-shrink: 0; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.7rem; color: var(--muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .leaflet-control-zoom a { background: #1a1714 !important; color: #f0ebe3 !important; border-color: rgba(255,255,255,0.1) !important; }
  .leaflet-control-attribution { background: rgba(14,12,10,0.8) !important; color: #8a8278 !important; font-size: 10px !important; }
  .sound-marker {
    width: 34px; height: 34px; border-radius: 50%; border: 2px solid;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.15s;
  }
  .sound-marker:hover { transform: scale(1.2); }
  .past-marker { background: var(--past-glow); border-color: var(--past); color: var(--past); }
  .present-marker { background: var(--present-glow); border-color: var(--present); color: var(--present); }
  .sound-marker svg { width: 15px; height: 15px; fill: currentColor; }
  .sound-marker.playing { animation: pulse 1.4s ease infinite; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 currentColor; }
    70%  { box-shadow: 0 0 0 10px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Paisajes Sonoros — La Candelaria</h1>
    <p>Archivos y memoria &nbsp;·&nbsp; Memoria urbana</p>
  </div>
  <div class="layer-toggle">
    <button class="layer-btn past active-past" onclick="setLayer('past')">◉ Pasado</button>
    <button class="layer-btn present" onclick="setLayer('present')">◉ Presente</button>
    <button class="layer-btn" style="color:var(--muted)" onclick="setLayer('both')">Ambos</button>
  </div>
</header>

<div class="main">
  <div id="map"></div>

  <div class="sidebar">
    <div class="sidebar-empty" id="emptyState">
      <div class="icon">♪</div>
      <p>Haz clic en un punto del mapa para escuchar el paisaje sonoro de ese lugar</p>
    </div>
    <div class="sidebar-detail" id="detailPanel">
      <div class="detail-header">
        <button class="close-btn" onclick="closeDetail()">✕</button>
        <div class="detail-era" id="detailEra"></div>
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-desc" id="detailDesc"></div>
      </div>
      <div class="player-section">
        <div class="player-label">Reproducir audio</div>
        <div class="player-box">
          <audio id="audioPlayer" controls preload="none">Tu navegador no soporta audio.</audio>
          <div class="player-filename" id="playerFilename"></div>
        </div>
      </div>
      <div class="metadata-section">
        <div class="meta-row"><span class="meta-key">Ubicación</span><span class="meta-val" id="metaLocation">—</span></div>
        <div class="meta-row"><span class="meta-key">Fecha</span><span class="meta-val" id="metaEpoch">—</span></div>
        <div class="meta-row"><span class="meta-key">Fuente</span><span class="meta-val" id="metaSource">—</span></div>
        <div class="meta-row"><span class="meta-key">Colección</span><span class="meta-val" id="metaCollection">—</span></div>
        <div class="meta-row"><span class="meta-key">Duración</span><span class="meta-val" id="metaDuration">—</span></div>
        <div class="meta-row"><span class="meta-key">Notas</span><span class="meta-val" id="metaNotes">—</span></div>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--past)"></div> Pasado</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--present)"></div> Presente</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>

/* ================================================================
   PASO 1 — IMAGEN DEL MAPA
   ================================================================
   Pon la ruta de tu imagen aquí.
   Puede ser el nombre del archivo si está en la misma carpeta:
       var MAPA_IMAGEN = "mapa_candelaria.png";
   O una URL completa:
       var MAPA_IMAGEN = "https://ejemplo.com/mapa.png";
   ================================================================ */

var MAPA_IMAGEN = "images/mapa.png";


/* ================================================================
   PASO 2 — LÍMITES DE LA IMAGEN EN EL MAPA
   ================================================================
   Estos valores le dicen al mapa qué área del mundo cubre tu imagen.
   Formato: [[latitud_sur, longitud_oeste], [latitud_norte, longitud_este]]

   Para encontrar tus coordenadas:
   1. Abre Google Maps
   2. Haz clic derecho en la esquina INFERIOR-IZQUIERDA de tu mapa
      → copia las coordenadas (ej: 4.5915, -74.0815)
   3. Haz clic derecho en la esquina SUPERIOR-DERECHA
      → copia las coordenadas (ej: 4.6025, -74.0728)
   4. Reemplaza los valores abajo

   Los valores actuales corresponden a La Candelaria (imagen de ejemplo):
   ================================================================ */

var MAPA_LIMITES = [
  [4.596459216824252, -74.07979326010617],   /* esquina inferior-izquierda (sur-oeste) */
  [4.607014889262396, -74.06953518011413]    /* esquina superior-derecha  (norte-este) */
];


/* ================================================================
   PASO 3 — PUNTOS SONOROS
   ================================================================
   Agrega aquí todos tus puntos. Cada punto tiene:

   id        → nombre único, sin espacios (usa guiones)
   era       → "past" para pasado, "present" para presente
   lat/lng   → coordenadas del punto (ver instrucciones abajo)
   title     → nombre que aparece en el panel lateral
   description → texto descriptivo corto
   audioSrc  → RUTA AL ARCHIVO DE AUDIO
   metadata  → datos archivísticos del registro

   CÓMO ENCONTRAR lat/lng DE UN PUNTO:
   1. Abre Google Maps y busca el lugar
   2. Haz clic derecho sobre el punto exacto
   3. Aparecen las coordenadas (ej: 4.5981, -74.0761)
   4. El primer número es lat, el segundo es lng
   ================================================================ */

var soundPoints = [

  /* ----------------------------------------------------------
     CAPA PASADO
     ---------------------------------------------------------- */
  {
    id: "past-plaza-bolivar",
    era: "past",
    lat: 4.605158119675337,          /* ← Google Maps: clic derecho → primer número  */
    lng: -74.07187004160484,      /* ← Google Maps: clic derecho → segundo número */
    title: "Entrevista trabajador informal",
    description: "Sonidos cotidianos de la Candelaria.",

    /* AUDIO — pon aquí la ruta a tu archivo de audio
       Ejemplos:
         "audios/plaza_bolivar_pasado.mp3"       (archivo en subcarpeta)
         "plaza_pasado.mp3"                       (misma carpeta que el HTML)
         "https://servidor.com/audio.mp3"         (URL externa)        */
    audioSrc: "audios/Terron.mpeg",

    metadata: {
      location:   "Cra. 7 #18-72, La Candelaria, Bogotá",
      epoch:      "19 de mayo de 2026",
      source:     "Entrevistado: ''Terron Tierra''",
      collection: "Memoria Viva de La Candelaria",
      duration:   "05:21 minutos",
      notes:      "Se muestra un ambiente nostálgico y cariñoso sobre la Bogotá antigua, donde la persona llamada ''Terron'' recuerda una ciudad muy tranquila y sonora musicalmente, donde la radio los acompañaba en su vida cotiana, hablando de la cultura Cachaca de esa época como su manera de vestir y de hablar como la identidad Bogotana de esa época."
    }
  },

  {
    id: "past-museo-botero",
    era: "past",
    lat: 4.603899074526455, 
    lng: -74.07239315264923,
    title: "Predicador - Carrera Septima",
    description: "Testimonio de habitante del barrio sobre la vida en esta casa antes de ser museo.",
    audioSrc: "audios/predicadores.mpeg",
    metadata: {
      location:   "Cra. 7 #7-43, La Candelaria, Bogotá",
      epoch:      "19 de mayo de 2026",
      source:     "Entrevistado: ''Argemiro Torres''",
      collection: "Memoria Viva de La Candelaria",
      duration:   "06:04",
      notes:      "Nombre Compara la ciudad actual con la ciudad en los años 80. Resalta una pérdida de valores morales, respeto y cultura, contrastando la elegancia de años atrás con lo que considera la decadencia de la juventud y la música moderna. Su relato describe elementos históricos como el sonido de la antigua avenida séptima, con sonidos representativos como el antiguo tranvía y una ciudad silenciosa."
    }
  },



  {
    id: "past-presidencia",
    era: "past",
    lat: 4.600338126692505, 
    lng: -74.07431973234922,
    title: "Presidencia — Calle 7",
    description: "Testimonios sobre el ruido y la vida política en la carrera séptima.",
    audioSrc: "audios/artesano.m4a",
    metadata: {
      location:   "Carrera 7 #12b-27, La Candelaria, Bogotá",
      epoch:      "19 de mayo de 2026",
      source:     "Entrevistado: ''Francisco Lopez''",
      collection: "Memoria Viva de La Candelaria",
      duration:   "03:39",
      notes:      "Opinión sobre el paisaje sonoro y el ruido cotidiano de los años 80 y la época actual, reconociendo la música más escuchada en ambas épocas, las costumbres de la gente del común, la cotidianidad y el entorno adornado por distintos sonidos en comparativa con ambos épocas"
    }
  },




  /* ----------------------------------------------------------
     CAPA PRESENTE
     ---------------------------------------------------------- */
  {
    id: "present-plaza-bolivar",
    era: "present",
    lat: 4.602334803207723, 
    lng: -74.07300557533532,
    title: "Paisaje sonoro: Estación Museo del Oro",
    description: "Sonidos del transporte público.",
    audioSrc: "audios/transmilenio.ogg",
    metadata: {
      location:   "Cll. 13 #6-28a, La Candelaria, Bogotá",
      epoch:      "19 de mayo de 2026",
      source:     "Registro sonoro propio",
      collection: "Paisajes sonoros de La Candelaria",
      duration:   "00:30",
      notes:      "Paisaje sonoro urbano registrado en estación de transporte público. Se identifican sonidos de apertura y cierre de puertas, anuncios del sistema, conversaciones de usuarios, pasos de peatones, movimiento constante de personas y ruido asociado a la operación y circulación del transporte masivo."
    }
  },



  {
    id: "present-museo-oro",
    era: "present",
    lat: 4.598328726840048,  
    lng: -74.07431973234922,
    title: "Ecos del comercio urbano en la Carrera Séptima",
    description: "Vida urbana contemporánea: comercio, ciudad.",
    audioSrc: "audios/ambiente.ogg",
    metadata: {
      location:   "Cra. 7 #15-95, La Candelaria, Bogotá",
      epoch:      "19 de mayo de 2026",
      source:     "Registro sonoro propio",
      collection: "Paisajes sonoros de La Candelaria",
      duration:   "00:28",
      notes:      "Paisaje sonoro urbano asociado a actividad comercial informal. Se perciben llamados y ofertas de vendedores, conversaciones entre transeúntes, flujo peatonal continuo, ruido de tránsito cercano y sonidos ambientales propios de una zona de alta circulación y actividad económica."
    }
  },



  {
    id: "present-archivo-bogota",
    era: "present",
    lat: 4.601177494572224, 
    lng: -74.07312040458895,
    title: "Voces y encuentros en la Plaza de Bolívar",
    description: "Vida del barrio hoy: vecinos, cultura, transformación urbana.",
    audioSrc: "audios/plaza_bolivar.ogg",
    metadata: {
      location:   "Cra. 7 #10-2a, La Candelaria, Bogotá",
      epoch:      "19 de mayo de 2026",
      source:     "Registro sonoro propio",
      collection: "Paisajes sonoros de La Candelaria",
      duration:   "00:17",
      notes:      "Paisaje sonoro de espacio público caracterizado por la presencia de actividades recreativas y sociales. Se registran voces y juegos de niños, sonidos producidos por palomas, conversaciones de visitantes y llamados de vendedores ambulantes, generando un ambiente dinámico y de interacción colectiva."
    }
  }

]; /* ← fin de soundPoints. Puedes seguir agregando más puntos antes de esta llave */


/* ================================================================
   A PARTIR DE AQUÍ NO ES NECESARIO EDITAR NADA
   ================================================================ */

var currentLayer = 'past';
var activeMarkerId = null;
var markers = {};

var map = L.map('map', {
  center: [
    (MAPA_LIMITES[0][0] + MAPA_LIMITES[1][0]) / 2,
    (MAPA_LIMITES[0][1] + MAPA_LIMITES[1][1]) / 2
  ],
  zoom: 16,
  zoomControl: true,
  minZoom: 14,
  maxZoom: 20
});

L.imageOverlay(MAPA_IMAGEN, MAPA_LIMITES).addTo(map);

function makeIcon(point) {
  var cls = point.era === 'past' ? 'past-marker' : 'present-marker';
  var path = point.era === 'past'
    ? 'M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z'
    : 'M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z';
  var html = '<div class="sound-marker ' + cls + '" id="marker-' + point.id + '">'
    + '<svg viewBox="0 0 24 24"><path d="' + path + '"/></svg></div>';
  return L.divIcon({ html: html, className: '', iconSize: [34, 34], iconAnchor: [17, 17] });
}

function openDetail(point) {
  document.getElementById('emptyState').style.display = 'none';
  var panel = document.getElementById('detailPanel');
  panel.classList.add('visible');
  var era = document.getElementById('detailEra');
  era.textContent = point.era === 'past' ? '▲ Pasado' : '▲ Presente';
  era.className = 'detail-era ' + point.era;
  document.getElementById('detailTitle').textContent = point.title;
  document.getElementById('detailDesc').textContent = point.description;
  var audio = document.getElementById('audioPlayer');
  audio.pause();
  audio.src = point.audioSrc;
  document.getElementById('playerFilename').textContent = point.audioSrc.split('/').pop();
  document.getElementById('metaLocation').textContent = point.metadata.location;
  document.getElementById('metaEpoch').textContent = point.metadata.epoch;
  document.getElementById('metaSource').textContent = point.metadata.source;
  document.getElementById('metaCollection').textContent = point.metadata.collection;
  document.getElementById('metaDuration').textContent = point.metadata.duration;
  document.getElementById('metaNotes').textContent = point.metadata.notes;
  if (activeMarkerId) {
    var prev = document.getElementById('marker-' + activeMarkerId);
    if (prev) prev.classList.remove('playing');
  }
  var curr = document.getElementById('marker-' + point.id);
  if (curr) curr.classList.add('playing');
  activeMarkerId = point.id;
}

function closeDetail() {
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('detailPanel').classList.remove('visible');
  document.getElementById('audioPlayer').pause();
  if (activeMarkerId) {
    var m = document.getElementById('marker-' + activeMarkerId);
    if (m) m.classList.remove('playing');
    activeMarkerId = null;
  }
}

function setLayer(layer) {
  currentLayer = layer;
  document.querySelectorAll('.layer-btn').forEach(function(b) {
    b.classList.remove('active-past', 'active-present');
  });
  var btns = document.querySelectorAll('.layer-btn');
  if (layer === 'past') btns[0].classList.add('active-past');
  else if (layer === 'present') btns[1].classList.add('active-present');
  else { btns[0].classList.add('active-past'); btns[1].classList.add('active-present'); }
  soundPoints.forEach(function(p) {
    var m = markers[p.id];
    if (!m) return;
    var show = (layer === 'both' || p.era === layer);
    if (show) map.addLayer(m); else map.removeLayer(m);
  });
}

soundPoints.forEach(function(point) {
  var m = L.marker([point.lat, point.lng], { icon: makeIcon(point) }).addTo(map);
  m.on('click', function() { openDetail(point); });
  markers[point.id] = m;
});

setLayer('past');
</script>
</body>
</html>
